<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кабинет классного руководителя</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#243247;background:#f2f5f9}header{background:#172d48;color:white;padding:20px}header small{display:block;color:#b9c9dd;margin-top:6px}nav{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:white;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:2}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #ccd5e0;border-radius:6px;background:white;color:inherit}button{cursor:pointer}button.active,button.primary{background:#244e80;color:white}main{max-width:1250px;margin:auto;padding:20px}h1{font-size:25px}h2{font-size:19px}h3{font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:white;border:1px solid #e0e6ee;border-radius:9px;padding:16px;margin-bottom:12px}.metric{font-size:30px;font-weight:700;display:block;margin:8px 0}.muted{color:#65758a;font-size:13px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:11px;border-bottom:1px solid #e7ebf0}th{background:#f6f8fb}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#edf4ff}.bad{color:#a73535}.good{color:#20754d}.warn{color:#9a620e}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar{height:9px;background:#e8edf3;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#437bb0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:65px;text-align:left;padding:5px}.day.event{background:#fff0d9}.day.active{background:#244e80;color:white}label{display:block;margin:8px 0}textarea{width:100%}footer{padding:20px;text-align:center;color:#65758a}@media(max-width:600px){main{padding:10px}nav{position:static}td,th{padding:8px}.day{min-height:45px;font-size:12px}}</style><header><b>Кабинет классного руководителя · 9А</b><small>2026–2027 учебный год · демонстрационный срез на 26 ноября 2026 · вымышленные данные</small></header><nav id="nav"></nav><main id="main"></main><footer>Автономный прототип. Нет подключения к МЭШ, СКУД или ГТО. Изменения хранятся только до перезагрузки страницы.</footer><script>
const first=['Артём','София','Максим','Анна','Михаил','Мария','Даниил','Алиса','Илья','Полина','Кирилл','Ева','Алексей','Дарья','Роман','Виктория','Никита','Ксения','Егор','Валерия','Матвей','Елизавета','Павел','Арина','Андрей'];const last=['Александров','Васильев','Дмитриев','Иванов','Козлов','Морозов','Петров','Соколов','Орлов','Лебедев','Волков','Смирнов','Новиков','Фёдоров','Попов','Семёнов','Кузнецов','Белов','Зайцев','Павлов','Сидоров','Голубев','Виноградов','Михайлов','Борисов'];const subjects=['Русский язык','Литература','Алгебра','Геометрия','История','Английский язык','Физика','Химия','Биология','Физкультура'];const P=first.map((n,i)=>{let grades=subjects.map((s,j)=>({s,g:Array.from({length:5},(_,k)=>Math.min(5,2+((i*7+j*3+k*5)%4)+(i%3===0?1:0)))}));let missed=(i*7)%23,valid=Math.floor(missed*.75),entry=i===6||i===19?'—':`08:${String(3+(i*7)%46).padStart(2,'0')}`;return {id:i,name:last[i]+(i%2?'а':'')+' '+n,sex:i%2?'Ж':'М',grades,avg:grades.flatMap(x=>x.g).reduce((a,b)=>a+b,0)/50,missed,valid,entry,exit:entry==='—'?'—':`15:${String(10+i%35).padStart(2,'0')}`,gto:i%5===0?'Не подтверждено':i%5===1?'Нет регистрации':'Зарегистрирован',done:i%5>1?i%7:0,social:i%7===0?'Требует обновления':'Актуален',family:i%6===0?'Один законный представитель':'Два законных представителя',support:i%8===0?'Предусмотрена школьная поддержка':'Не указана',note:''}});let events=[{date:'2026-11-27',time:'09:00',type:'ГТО',title:'Приём нормативов',place:'Спортивный зал'},{date:'2026-11-30',time:'18:00',type:'Родители',title:'Родительское собрание',place:'Кабинет 305'},{date:'2026-12-03',time:'10:00',type:'Учёба',title:'Диагностическая работа',place:'Кабинет 210'}];let tasks=[{title:'Проверить причины пропусков',done:false},{title:'Актуализировать социальные паспорта',done:false},{title:'Уточнить регистрацию ГТО',done:false}];let page='home',pid=0,tab='digital',q='',filter='all',month=10,year=2026,date='2026-11-27';const labels={home:'Рабочий стол',students:'Мой класс',social:'Социальные паспорта',digital:'Цифровые паспорта',gto:'ГТО',calendar:'Календарь',tasks:'Задачи',reports:'Аналитика'};const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sum=f=>P.reduce((a,p)=>a+f(p),0),registered=()=>P.filter(p=>p.gto==='Зарегистрирован').length,metric=(v,t)=>`<div class="card"><span class="muted">${t}</span><b class="metric">${v}</b></div>`,card=(t,b)=>`<section class="card"><h2>${t}</h2>${b}</section>`,table=(heads,rows)=>`<div class="scroll"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`,row=(cells,id)=>`<tr ${id===undefined?'':`data-id="${id}"`}>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`,status=(s,c)=>`<span class="${c}">${esc(s)}</span>`,link=(p)=>`<button onclick="openP(${p.id})">${p.name}</button>`,go=k=>{page=k;q='';filter='all';render()},openP=i=>{pid=i;tab=['social','gto'].includes(page)?page:'digital';page='profile';render()},pct=(n,d)=>Math.round(n/d*100),bar=n=>`<div class="bar"><i style="width:${n}%"></i></div>`;function render(){ $('nav').innerHTML=Object.entries(labels).map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');let b=`<h1>${labels[page]||'Карточка ученика'}</h1>`;if(page==='home'){b+=`<div class="grid">${metric(P.length,'Учеников')}${metric(P.filter(p=>p.entry!=='—').length,'Вход зафиксирован сегодня')}${metric((sum(p=>p.avg)/25).toFixed(2),'Средний балл')}${metric(registered()+'/25','Регистрация ГТО')}</div>`;b+=card('Требуют проверки',table(['Событие','Ученик','Действие'],[...P.filter(p=>p.entry==='—').map(p=>row(['Нет отметки входа',link(p),'Сверить с журналом'])),...P.filter(p=>p.missed-p.valid>=5).map(p=>row(['5+ пропусков без подтверждённой причины',link(p),'Уточнить причину']))]));b+=card('Ближайшие мероприятия',eventList(events.filter(e=>e.date>='2026-11-26')))+card('Рабочие задачи',tasks.map(t=>`<p>${t.done?'✓':'○'} ${esc(t.title)}</p>`).join('')+'<button onclick="go(\'tasks\')">Открыть задачи</button>')}else if(['students','social','digital','gto'].includes(page)){if(page==='gto')b+=`<div class="grid">${metric(registered(),'Зарегистрированы')}${metric(P.filter(p=>p.gto==='Нет регистрации').length,'Нет регистрации')}${metric(P.filter(p=>p.gto==='Не подтверждено').length,'Не подтверждено')}</div>`;b+=`<div class="tools"><input id="q" placeholder="Поиск по ФИО" value="${esc(q)}" oninput="q=this.value;render();document.getElementById('q').focus()"><select onchange="filter=this.value;render()">${[['all','Все ученики'],['miss','5+ неподтверждённых пропусков'],['entry','Нет входа'],['gto','ГТО не подтверждено'],['social','Паспорт требует обновления']].map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v}</option>`).join('')}</select></div>`;let ps=P.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())&&(filter==='all'||filter==='miss'&&p.missed-p.valid>=5||filter==='entry'&&p.entry==='—'||filter==='gto'&&p.gto!=='Зарегистрирован'||filter==='social'&&p.social!=='Актуален'));let heads=page==='social'?['Ученик','Актуальность','Дата проверки']:page==='gto'?['Ученик','Регистрация','Нормативы']:['Ученик','Средний балл','Пропуски','Без подтверждения','Вход','Выход'];b+=card('Найдено: '+ps.length,table(heads,ps.map(p=>row(page==='social'?[p.name,status(p.social,p.social==='Актуален'?'good':'warn'),p.social==='Актуален'?'20.11.2026':'01.09.2026']:page==='gto'?[p.name,status(p.gto,p.gto==='Зарегистрирован'?'good':'warn'),p.gto==='Зарегистрирован'?p.done+' выполнено':'Нет данных']:[p.name,p.avg.toFixed(2),p.missed,p.missed-p.valid,p.entry,p.exit],p.id))))}else if(page==='profile'){let p=P[pid];b+=`<button onclick="go('students')">← К списку</button><h2>${p.name} · 9А</h2><div class="tools">${[['digital','Цифровой паспорт'],['social','Социальный паспорт'],['gto','ГТО'],['notes','Заметки']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}</div>`;if(tab==='digital'){b+=`<div class="grid">${metric(p.avg.toFixed(2),'Средний балл')}${metric(p.missed,'Пропущено уроков')}${metric(p.valid,'Причина подтверждена')}${metric(p.missed-p.valid,'Причина не подтверждена')}</div>`+card('Успеваемость за текущий период',table(['Предмет','Оценки','Средний'],p.grades.map(g=>row([g.s,g.g.join(' · '),(g.g.reduce((a,b)=>a+b,0)/g.g.length).toFixed(2)]))))+card('Посещаемость уроков',`<p>По демонстрационному плану: 240 уроков. Посещено: ${240-p.missed}. Посещаемость: ${pct(240-p.missed,240)}%.</p>${bar(pct(240-p.missed,240))}`)+card('История проходов через СКУД',table(['Дата','Первый вход','Последний выход'],[row(['26.11.2026',p.entry,p.exit]),row(['25.11.2026','08:14','15:23']),row(['24.11.2026','08:09','15:19'])])+'<p class="muted">Отсутствие отметки прохода не доказывает отсутствие ученика на уроке.</p>')}else if(tab==='social'){b+=card('Социальные сведения (вымышленные)',`<p>Состав семьи: ${p.family}</p><p>Социальная поддержка: ${p.support}</p><p>Контакты представителей: не используются в демо</p><p>Актуальность: ${p.social}</p><button onclick="P[pid].social='Актуален';render()">Отметить проверенным</button><p class="muted">В реальной системе доступ только по полномочиям.</p>`)}else if(tab==='gto'){b+=card('Регистрация и участие',`<label>Статус <select onchange="P[pid].gto=this.value;render()">${['Зарегистрирован','Нет регистрации','Не подтверждено'].map(s=>`<option ${p.gto===s?'selected':''}>${s}</option>`).join('')}</select></label><p>Выполнено нормативов: ${p.gto==='Зарегистрирован'?p.done:'Нет данных'}</p><p>Ступень и знак: не определены, необходима проверка официальных результатов.</p>`)}else b+=card('Рабочая заметка',`<textarea rows="5" oninput="P[pid].note=this.value" placeholder="Добавить заметку">${esc(p.note)}</textarea><p class="muted">Сохраняется в текущем сеансе.</p>`)}else if(page==='calendar'){let count=new Date(year,month+1,0).getDate(),offset=(new Date(year,month,1).getDay()+6)%7,iso=d=>`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;b+=card('Календарь',`<div class="tools"><button onclick="shift(-1)">←</button><b>${new Date(year,month,1).toLocaleDateString('ru',{month:'long',year:'numeric'})}</b><button onclick="shift(1)">→</button></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<b>${x}</b>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,i)=>`<button class="day ${events.some(e=>e.date===iso(i+1))?'event':''} ${date===iso(i+1)?'active':''}" onclick="date='${iso(i+1)}';render()">${i+1}${events.some(e=>e.date===iso(i+1))?' •':''}</button>`).join('')}</div>`)+card('Мероприятия '+date,eventList(events.filter(e=>e.date===date)))+card('Добавить мероприятие',`<form onsubmit="addEvent(event)"><label>Название <input name="title" required></label><label>Дата <input name="date" type="date" value="${date}" required></label><label>Время <input name="time" type="time" required></label><label>Категория <select name="type"><option>Учёба</option><option>ГТО</option><option>Родители</option><option>Спорт</option><option>Школа</option></select></label><label>Место <input name="place"></label><button class="primary">Добавить</button></form>`)}else if(page==='tasks'){b+=card('Список задач',tasks.map((t,i)=>`<label><input type="checkbox" ${t.done?'checked':''} onchange="tasks[${i}].done=this.checked;render()"> ${esc(t.title)}</label>`).join('')+`<form onsubmit="event.preventDefault();tasks.push({title:this.title.value,done:false});render()"><input name="title" required placeholder="Новая задача"><button>Добавить</button></form>`)}else{b+=`<div class="grid">${metric(sum(p=>p.missed),'Пропущено уроков')}${metric(sum(p=>p.missed-p.valid),'Причина не подтверждена')}${metric(pct(registered(),25)+'%','Охват ГТО')}${metric(P.filter(p=>p.social!=='Актуален').length,'Паспорта к обновлению')}</div>`+card('Средний балл по предметам',subjects.map((s,j)=>{let v=sum(p=>p.grades[j].g.reduce((a,b)=>a+b,0)/5)/25;return `<p>${s} — ${v.toFixed(2)}</p>${bar(v/5*100)}`}).join(''))+card('Сводный реестр',`<button onclick="download()">Выгрузить CSV для Excel</button>`)}$('main').innerHTML=b;document.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openP(+r.dataset.id))}function eventList(es){return es.length?table(['Дата','Время','Мероприятие','Категория','Место'],es.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>row([esc(e.date),esc(e.time),esc(e.title),esc(e.type),esc(e.place)]))):'<p>Мероприятий нет</p>'}function shift(n){let d=new Date(year,month+n,1);year=d.getFullYear();month=d.getMonth();render()}function addEvent(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));events.push(x);date=x.date;let d=new Date(date+'T12:00:00');year=d.getFullYear();month=d.getMonth();render()}function download(){let csv='\ufeffУченик;Средний балл;Пропуски;Подтверждено;Вход;Выход;ГТО\n'+P.map(p=>[p.name,p.avg.toFixed(2).replace('.',','),p.missed,p.valid,p.entry,p.exit,p.gto].join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='9A-demo.csv';a.click();URL.revokeObjectURL(a.href)}render();</script></html>
