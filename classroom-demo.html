function render(){ renderNavigation();let b=`<h1 id="section-title" tabindex="-1">${labels[page]||'Карточка ученика'}</h1>`;if(page==='home'){b+=`<div class="grid">${metric(P.length,'Учеников')}${metric(P.filter(p=>p.entry!=='—').length,'Вход зафиксирован сегодня')}${metric((sum(p=>p.avg)/25).toFixed(2),'Средний балл')}${metric(sum(p=>p.missed),'Пропущено уроков')}${metric(sum(p=>p.sick),'Н по болезни')}</div>`;b+=gtoOverview()+card('Требуют проверки',table(['Событие','Ученик','Действие'],P.filter(p=>p.entry==='—').map(p=>row(['Нет отметки входа',link(p),'Сверить с журналом']))));b+=card('Ближайшие мероприятия',eventList(events.filter(e=>e.date>='2026-11-26')))+card('Рабочие задачи',tasks.map(t=>`<p>${t.done?'✓':'○'} ${esc(t.title)}</p>`).join('')+'<button onclick="go(\'tasks\')">Открыть задачи</button>')}else if(['students','social','digital','gto'].includes(page)){if(page==='gto')b+=gtoOverview();b+=`<div class="tools"><input id="q" placeholder="Поиск по ФИО" value="${esc(q)}" oninput="q=this.value;render();document.getElementById('q').focus()"><select onchange="filter=this.value;render()">${[['all','Все ученики'],['sick','Есть Н по болезни'],['entry','Нет входа'],['gto','ГТО — нет регистрации'],['social','Паспорт требует обновления']].map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v}</option>`).join('')}</select></div>`;let ps=P.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())&&(filter==='all'||filter==='sick'&&p.sick>0||filter==='entry'&&p.entry==='—'||filter==='gto'&&!p.gtoRegistered||filter==='social'&&p.social!=='Актуален'));let heads=page==='social'?['Ученик','Актуальность','Дата проверки']:page==='gto'?['Ученик','Регистрация','Приход']:['Ученик','Средний балл','Пропуски','Н по болезни','Вход','Выход'];b+=card('Найдено: '+ps.length,table(heads,ps.map(p=>row(page==='social'?[p.name,status(p.social,p.social==='Актуален'?'good':'warn'),p.social==='Актуален'?'20.11.2026':'01.09.2026']:page==='gto'?[p.name,gtoRegistration(p),p.gtoArrived?'Да':'Нет']:[p.name,p.avg.toFixed(2),p.missed,p.sick,p.entry,p.exit],p.id))))}else if(page==='passes'){b+=renderPassList()}else if(page==='profile'){let p=P[pid];b+=`<button onclick="go('students')">← К списку</button><h2>${p.name} · 9А</h2><div class="tools">${[['digital','Цифровой паспорт'],['social','Социальный паспорт'],['gto','ГТО'],['notes','Заметки']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}</div>`;if(tab==='digital'){b+=`<div class="grid">${metric(p.avg.toFixed(2),'Средний балл')}${metric(p.missed,'Пропущено уроков')}${metric(p.sick,'Н по болезни')}</div>`+card('Успеваемость за текущий период',table(['Предмет','Оценки','Средний','Н','Н по болезни'],p.grades.map(g=>row([g.s,g.g.join(' · '),(g.g.reduce((a,b)=>a+b,0)/g.g.length).toFixed(2),g.missed,g.sick]))))+card('Посещаемость уроков',`<p>По демонстрационному плану: 240 уроков. Посещено: ${240-p.missed}. Посещаемость: ${pct(240-p.missed,240)}%.</p>${bar(pct(240-p.missed,240))}`)+card('История проходов через СКУД',table(['Дата','Первый вход','Последний выход'],[row(['26.11.2026',p.entry,p.exit]),row(['25.11.2026','08:14','15:23']),row(['24.11.2026','08:09','15:19'])])+'<p class="muted">Отсутствие отметки прохода не доказывает отсутствие ученика на уроке.</p>')}else if(tab==='social'){b+=card('Социальные сведения (вымышленные)',`<p>Состав семьи: ${p.family}</p><p>Социальная поддержка: ${p.support}</p><p>Контакты представителей: не используются в демо</p><p>Актуальность: ${p.social}</p><button onclick="P[pid].social='Актуален';render()">Отметить проверенным</button><p class="muted">В реальной системе доступ только по полномочиям.</p>`)}else if(tab==='gto'){b+=card('ГТО',table(['Регистрация','Приход'],[row([
  `<label>Регистрация <select onchange="setGtoRegistration(this.value==='yes')" aria-label="Регистрация ГТО">
    <option value="yes" ${p.gtoRegistered?'selected':''}>Да</option>
    <option value="no" ${!p.gtoRegistered?'selected':''}>Нет</option>
  </select></label>
  ${p.gtoRegistered?`<label>Дата сдачи <input type="date" value="${p.gtoDate}" required aria-label="Дата сдачи ГТО" onchange="setGtoDate(this)"></label>`:''}`,
  `<label>Приход <select aria-label="Приход ГТО" onchange="P[pid].gtoArrived=this.value==='yes';render()">
    <option value="yes" ${p.gtoArrived?'selected':''}>Да</option>
    <option value="no" ${!p.gtoArrived?'selected':''}>Нет</option>
  </select></label>`
])]))}else b+=card('Рабочая заметка',`<textarea rows="5" oninput="P[pid].note=this.value" placeholder="Добавить заметку">${esc(p.note)}</textarea><p class="muted">Сохраняется в текущем сеансе.</p>`)}else if(page==='calendar'){let count=new Date(year,month+1,0).getDate(),offset=(new Date(year,month,1).getDay()+6)%7,iso=d=>`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;b+=card('Календарь',`<div class="tools"><button onclick="shift(-1)">←</button><b>${new Date(year,month,1).toLocaleDateString('ru',{month:'long',year:'numeric'})}</b><button onclick="shift(1)">→</button></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<b>${x}</b>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,i)=>`<button class="day ${events.some(e=>e.date===iso(i+1))?'event':''} ${date===iso(i+1)?'active':''}" onclick="date='${iso(i+1)}';render()">${i+1}${events.some(e=>e.date===iso(i+1))?' •':''}</button>`).join('')}</div>`)+card('Мероприятия '+date,eventList(events.filter(e=>e.date===date)))+card('Добавить мероприятие',`<form onsubmit="addEvent(event)"><label>Название <input name="title" required></label><label>Дата <input name="date" type="date" value="${date}" required></label><label>Время <input name="time" type="time" required></label><label>Категория <select name="type"><option>Учёба</option><option>ГТО</option><option>Родители</option><option>Спорт</option><option>Школа</option></select></label><label>Место <input name="place"></label><button class="primary">Добавить</button></form>`)}else if(page==='tasks'){b+=card('Список задач',tasks.map((t,i)=>`<label><input type="checkbox" ${t.done?'checked':''} onchange="tasks[${i}].done=this.checked;render()"> ${esc(t.title)}</label>`).join('')+`<form onsubmit="event.preventDefault();tasks.push({title:this.title.value,done:false});render()"><input name="title" required placeholder="Новая задача"><button>Добавить</button></form>`)}else{b+=`<div class="grid">${metric(sum(p=>p.missed),'Пропущено уроков')}${metric(sum(p=>p.sick),'Н по болезни')}${metric(P.filter(p=>p.social!=='Актуален').length,'Паспорта к обновлению')}</div>`+gtoOverview()+card('Средний балл по предметам',subjects.map((s,j)=>{let v=sum(p=>p.grades[j].g.reduce((a,b)=>a+b,0)/5)/25;return `<p>${s} — ${v.toFixed(2)}</p>${bar(v/5*100)}`}).join(''))+card('Сводный реестр',`<button onclick="download()">Выгрузить CSV для Excel</button>`)}$('main').innerHTML=b;document.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openP(+r.dataset.id))}function eventList(es){return es.length?table(['Дата','Время','Мероприятие','Категория','Место'],es.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>row([esc(e.date),esc(e.time),esc(e.title),esc(e.type),esc(e.place)]))):'<p>Мероприятий нет</p>'}function shift(n){let d=new Date(year,month+n,1);year=d.getFullYear();month=d.getMonth();render()}function addEvent(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));events.push(x);date=x.date;let d=new Date(date+'T12:00:00');year=d.getFullYear();month=d.getMonth();render()}function download(){let csv='\ufeffУченик;Средний балл;Пропуски;Н по болезни;Вход;Выход;ГТО — Регистрация;ГТО — Приход\n'+P.map(p=>[p.name,p.avg.toFixed(2).replace('.',','),p.missed,p.sick,p.entry,p.exit,gtoRegistration(p),p.gtoArrived?'Да':'Нет'].join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='9A-demo.csv';a.click();URL.revokeObjectURL(a.href)}initializePasses();render();</script></html>
